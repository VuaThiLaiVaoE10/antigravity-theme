<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081826"/>
      <stop offset="50%" stop-color="#0f2b3f"/>
      <stop offset="100%" stop-color="#15415E"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DCFFF"/>
      <stop offset="100%" stop-color="#BB9AF7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="rgba(125,207,255,0.35)" stroke-width="8"/>
  <!-- Glass inner card -->
  <rect x="64" y="64" width="384" height="384" rx="70" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <!-- Stylized Antigravity 'A' with palette curves -->
  <path d="M256 120 L360 360 L300 360 L275 300 L237 300 L212 360 L152 360 Z M256 210 L245 260 L267 260 Z" fill="url(#glowGrad)" filter="url(#glow)"/>
  <!-- Orbit Ring -->
  <ellipse cx="256" cy="280" rx="160" ry="50" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="14 10" transform="rotate(-20 256 280)" opacity="0.85"/>
  <!-- Floating sparkles -->
  <circle cx="370" cy="180" r="10" fill="#7DCFFF"/>
  <circle cx="140" cy="320" r="8" fill="#BB9AF7"/>
  <circle cx="340" cy="350" r="6" fill="#73DACA"/>
</svg>
